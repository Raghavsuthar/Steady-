name: Android verification

on:
  push:
    branches:
      - "feat/phase-0-stabilize"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steady-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package was removed; install platform-tools explicitly.
          packages: "platform-tools"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run lint
        run: gradle :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Commit generated v2 schema from branch push
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/feat/phase-0-stabilize'
        run: |
          if [ -f app/schemas/com.example.data.local.SteadyDatabase/2.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/schemas/com.example.data.local.SteadyDatabase/2.json
            if ! git diff --cached --quiet; then
              git commit -m "test: capture generated Room v2 schema [skip ci]"
              git push
            fi
          fi

      - name: Upload generated Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steady-room-schema
          path: app/schemas/
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: steady-debug-apk
          path: app/build/outputs/apk/debug/*.apk
